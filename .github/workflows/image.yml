# Publishes the vmobj image to the GitHub Container Registry, for amd64
# and arm64, under two names, ghcr.io/wilminator/vmobj and
# ghcr.io/wilminator/vm-objects:
#
#   - a version tag such as v1.2.3 publishes 1.2.3, 1.2 and latest;
#   - every push to main publishes edge.
#
# Pull requests never reach this workflow: CI (ci.yml) builds the image for
# them without publishing. Like CI, this runs on GitHub-hosted runners only.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # The same image under two names: the repository's, and the
          # command's (shorter to type).
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository_owner }}/vmobj
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
