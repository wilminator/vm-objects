# Runs on GitHub-hosted runners only. This repository is public, so its
# workflows must never run on self-hosted machines: anyone can open a pull
# request, and the job would run their code there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests (with the race detector)
        run: go test -race -count=1 ./...

      - name: Build static binaries
        run: make build-all
