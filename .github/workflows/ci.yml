# Runs on GitHub-hosted runners only. This repository is public, so its
# workflows must never run on self-hosted machines: anyone can open a pull
# request, and the job would run their code there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install QEMU tools (the qcow2 tests compare against qemu-img)
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-utils
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests (with the race detector)
        run: go test -race -count=1 ./...

      - name: Build static binaries
        run: make build-all

      - name: End-to-end against a local folder
        run: |
          make build
          scripts/e2e.sh "$RUNNER_TEMP/e2e-repo" bin/vmobj
      - name: Whole-VM end-to-end (stand-in virsh)
        run: scripts/vm-e2e.sh bin/vmobj

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the binaries in a container
        run: docker build --target export --build-arg VERSION=ci --output type=local,dest=out .

      - name: Check them
        run: |
          file out/vmobj-linux-amd64 out/vmobj-linux-arm64
          file out/vmobj-linux-amd64 | grep -q 'x86-64.*statically linked'
          file out/vmobj-linux-arm64 | grep -q 'ARM aarch64.*statically linked'
          ./out/vmobj-linux-amd64 version | grep -qx 'vmobj ci'

      - name: Build the runtime image and run it
        run: |
          docker build --build-arg VERSION=ci -t vmobj:ci .
          docker run --rm vmobj:ci version | grep -qx 'vmobj ci'
          docker image ls vmobj:ci

  # Real ZFS: a throwaway pool in a file on the runner. Skipped (with a
  # notice) if the runner's kernel has no ZFS module.
  zfs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up ZFS
        id: zfs
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zfsutils-linux || true
          if sudo modprobe zfs 2>/dev/null && command -v zpool >/dev/null; then
            truncate -s 512M "$RUNNER_TEMP/pool.img"
            sudo zpool create vmobjci "$RUNNER_TEMP/pool.img"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ZFS is not available on this runner; zfs: sources were not tested end to end"
          fi
      - name: "End-to-end with zfs: sources"
        if: steps.zfs.outputs.ok == 'true'
        run: |
          make build
          sudo scripts/zfs-e2e.sh vmobjci bin/vmobj

  # The same checks against a real S3 API. MinIO runs in a throwaway
  # container on the runner; the credentials below exist only inside it.
  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: vmobj-ci
      AWS_SECRET_ACCESS_KEY: vmobj-ci-not-a-secret
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # MinIO's community edition is now published as source only (no
      # images or binaries since October 2025), so build the last release
      # from source and cache the binary between runs.
      - name: Cache the MinIO build
        id: minio-cache
        uses: actions/cache@v6
        with:
          path: ~/minio-bin
          key: minio-RELEASE.2025-10-15T17-29-55Z-${{ runner.os }}-${{ runner.arch }}
      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          GOBIN="$HOME/minio-bin" go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z \
            || { echo "::error::building MinIO from source failed"; exit 1; }
      - name: Start MinIO
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            nohup "$HOME/minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 60); do curl -sf "$ENDPOINT/minio/health/live" >/dev/null && break; sleep 1; done
          curl -sf "$ENDPOINT/minio/health/live" >/dev/null || { echo "::error::MinIO did not start: $(tail -3 "$RUNNER_TEMP/minio.log" | tr '\n' ' ')"; exit 1; }
      - name: Create the test bucket
        run: go run ./scripts/mkbucket "s3://vmobj-ci?endpoint=$ENDPOINT" || { echo "::error::could not create the test bucket"; exit 1; }
      - name: Backend conformance tests (including Object Lock)
        # Failing test lines are repeated as annotations, which can be read
        # from the run summary and the API without downloading logs.
        run: |
          set -o pipefail
          go test -count=1 -v -run 'Conformance|Locks' ./internal/store/ 2>&1 | tee "$RUNNER_TEMP/conformance.txt" || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|\.go:[0-9]+: ' "$RUNNER_TEMP/conformance.txt" | head -20 | sed 's/^/::error::/'
            exit 1
          }
        env:
          VMOBJ_TEST_S3: s3://vmobj-ci/conformance?endpoint=http://127.0.0.1:9000
          VMOBJ_TEST_S3_LOCKS: "1"
      - name: End-to-end against S3
        # MinIO, like most self-hosted services, only has Standard storage.
        env:
          E2E_BACKUP_ARGS: --profile standard
        run: |
          make build
          scripts/e2e.sh "s3://vmobj-ci/e2e-$GITHUB_RUN_ID?endpoint=$ENDPOINT" bin/vmobj
      - name: End-to-end against S3 with Object Lock
        env:
          E2E_BACKUP_ARGS: --profile standard
          E2E_INIT_ARGS: --object-lock
        run: scripts/e2e.sh "s3://vmobj-ci/e2e-locked-$GITHUB_RUN_ID?endpoint=$ENDPOINT" bin/vmobj
      - name: MinIO log on failure
        if: failure()
        run: tail -50 "$RUNNER_TEMP/minio.log" || true
